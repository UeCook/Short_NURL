# ShortURL Nginx 配置文件
# 主配置文件
#
# 架构说明：
#   - 公开服务：   443（HTTPS）— 静态文件、API、短链跳转
#   - 内部服务：   127.0.0.1:18500 — Lua 接口，仅本地访问
#   - 80 端口：    HTTP → HTTPS 重定向（可选，被防火墙封了就注释掉）

worker_processes  auto;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;

    # 隐藏版本信息
    server_tokens off;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # 请求体大小限制
    client_max_body_size 16k;

    # ── 共享字典 ───────────────────────────────────────
    lua_shared_dict su_url       4m;
    lua_shared_dict su_exp       2m;
    lua_shared_dict su_meta      1m;

    # ── Lua 模块搜索路径 ───────────────────────────────
    lua_package_path "{prefix}/lua/?.lua;;";

    # ── 限流区域 ───────────────────────────────────────
    # API 限流：每 IP 每分钟 30 次请求
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # 跳转限流：每 IP 每秒 2 次，突发 10（5 秒窗口内最多 10 次）
    limit_req_zone $binary_remote_addr zone=redirect_burst:10m rate=2r/s;

    # ── Worker 初始化 ─────────────────────────────────
    init_worker_by_lua_block {
        math.randomseed(ngx.time() + ngx.worker.id())
        local init = require "shorturl.init"
        init.init()
    }

    # ── 内部服务（仅本地，端口 18500）──────────────────
    # PHP 通过 http://127.0.0.1:18500/internal/* 读写热存储
    # 此端口不对外暴露，仅回环地址可达
    # 独立于公开端口（80/443），防火墙封 80 也不影响内部通信
    #
    # Docker 部署说明：
    #   当 PHP 容器通过 bridge 网络连接时，请求来自 Docker 网桥网关（如 172.19.0.1），
    #   而非 127.0.0.1。需要将 allow 指令中的 IP 替换为你实际的 Docker 网桥子网。
    #   例如：Docker 网桥为 172.19.0.0/16，则 allow 172.19.0.0/16;
    #   同时 config.php 中的 internal_host 也必须指向 OpenResty 容器在 Docker 网络中的 IP。
    #   可用命令查看：docker network inspect <网络名> | grep Gateway
    server {
        listen 18500;
        server_name _;

        location /internal/ {
            # ── 访问控制（按部署环境选择一种）──────────
            # 方式 A：本地部署（PHP 和 OpenResty 在同一宿主机）
            #   allow 127.0.0.1;
            #   deny all;
            # 方式 B：Docker bridge 部署（PHP 在独立容器中）
            #   替换为你的 Docker 网桥子网，例如：
            #   allow 172.19.0.0/16;
            #   deny all;
            # 方式 C：混合部署（同时允许本地和 Docker）
            allow 127.0.0.1;
            allow 172.19.0.0/16;
            deny all;

            content_by_lua_block {
                local internal = require "shorturl.internal"
                internal.dispatch()
            }
        }
    }

    # ── HTTP → HTTPS 重定向（可选）────────────────────
    # 如果 80 端口开放则取消注释；防火墙封了 80 就保持注释状态
    # server {
    #     listen 80;
    #     server_name s.yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }

    # ── 公开 HTTPS 服务 ───────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name s.yourdomain.com;

        # ── SSL 证书（替换为你的实际路径）────────────
        ssl_certificate     /etc/ssl/certs/your-cert.pem;
        ssl_certificate_key /etc/ssl/private/your-key.pem;

        # ── SSL 加固 ─────────────────────────────────
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── 业务参数 ────────────────────────────────
        set $su_php_fpm          "{ deny all; }";   # PHP-FPM 监听地址，按实际环境修改
        set $su_domain           "{ 你的域名; }";
        set $su_tz_offset        "+08:00";
        set $su_perm_path        "{prefix}/backend/data/perm.json";
        set $su_temp_path        "{prefix}/backend/data/temp.json";
        set $su_perm_limit       9999;
        set $su_temp_limit       9999;
        set $su_expire_interval  3600;
        set $su_redirect_code    302;

        # ── 安全响应头 ──────────────────────────────
        add_header X-Content-Type-Options  "nosniff"          always;
        add_header X-Frame-Options         "DENY"             always;
        add_header X-XSS-Protection        "1; mode=block"    always;
        add_header Referrer-Policy         "no-referrer"      always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ── 屏蔽敏感目录 ────────────────────────────
        location ^~ /data/ {
            deny all;
            return 404;
        }
        location ^~ /lua/ {
            deny all;
            return 404;
        }

        # ── 静态前端文件 ────────────────────────────
        location / {
            root /opt/shorturl/frontend;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # ── API 路由 → PHP-FPM ──────────────────────
        location ^~ /api/ {
            limit_req zone=api burst=5 nodelay;

            location = /api/create {
                limit_except POST { deny all; }
                fastcgi_pass $su_php_fpm;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /opt/shorturl/api/routes/create.php;
                include fastcgi_params;
            }

            location = /api/delete {
                limit_except POST { deny all; }
                fastcgi_pass $su_php_fpm;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /opt/shorturl/api/routes/delete.php;
                include fastcgi_params;
            }

            location = /api/list {
                limit_except GET { deny all; }
                fastcgi_pass $su_php_fpm;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /opt/shorturl/api/routes/list.php;
                include fastcgi_params;
            }

            location = /api/stat {
                limit_except GET { deny all; }
                fastcgi_pass $su_php_fpm;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /opt/shorturl/api/routes/stat.php;
                include fastcgi_params;
            }
        }

        # ── 无头链路路由 → PHP-FPM ──────────────────
        location ^~ /headless/api/ {
            limit_req zone=api burst=5 nodelay;

            location = /headless/api/create {
                limit_except POST { deny all; }
                fastcgi_pass $su_php_fpm;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /opt/shorturl/headless/create.php;
                include fastcgi_params;
            }

            location = /headless/api/delete {
                limit_except POST { deny all; }
                fastcgi_pass $su_php_fpm;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /opt/shorturl/headless/delete.php;
                include fastcgi_params;
            }

            location = /headless/api/list {
                limit_except GET { deny all; }
                fastcgi_pass $su_php_fpm;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /opt/shorturl/headless/list.php;
                include fastcgi_params;
            }

            location = /headless/api/stat {
                limit_except GET { deny all; }
                fastcgi_pass $su_php_fpm;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /opt/shorturl/headless/stat.php;
                include fastcgi_params;
            }

            location ~ ^/headless/api/get/([0-9a-z-]{1,4})$ {
                limit_except GET { deny all; }
                fastcgi_pass $su_php_fpm;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /opt/shorturl/headless/get.php;
                fastcgi_param PATH_INFO       /$1;
                include fastcgi_params;
            }
        }

        # ── 短链跳转（最低优先级）────────────────────
        location ~* ^/([0-9a-z-]{1,4})$ {
            limit_req zone=redirect_burst burst=10 nodelay;
            limit_except GET { deny all; }
            content_by_lua_block {
                local redirect = require "shorturl.redirect"
                redirect.go()
            }
        }
    }
}
